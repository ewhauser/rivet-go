[workspace]
members = ["crates/rivetkit-go-ffi"]
exclude = ["crates/rivet-depot-client-pinned"]
resolver = "2"

[patch."https://github.com/rivet-dev/rivet"]
# Pinned v2.3.10 Depot source with the audited local corrections recorded in
# docs/FFI-BOUNDARY.md. No dependency version or upstream pin changes.
rivet-depot-client = { path = "crates/rivet-depot-client-pinned" }

[profile.release]
panic = "unwind"
strip = false
