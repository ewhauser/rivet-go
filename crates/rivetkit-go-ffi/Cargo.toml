[package]
name = "rivetkit-go-ffi"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The committed native artifacts include a private panic probe so the Go
# loader tests can exercise catch_unwind through the real dynamic library.
ffi-test = []

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
ciborium = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
url = "2"

# v2.3.10 is the newest stable, non-RC engine release in rivet-dev/rivet as of
# 2026-08-02. Keep this exact tag in sync with docs/PINNED-VERSION.md.
rivetkit-core = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10", default-features = false, features = ["native-runtime", "sqlite-local", "sqlite-remote"] }
rivet-error = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10" }
rivet-depot-client = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10" }

[dev-dependencies]
async-trait = "0.1"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
proptest = "1"
rivet-depot-client = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10", features = ["test-hooks"] }
rivet-envoy-protocol = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10" }
tempfile = "3"
