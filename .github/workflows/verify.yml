name: verify

on:
  pull_request: {}
  push:
    branches: [main, ci-green]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            libc: native
          - name: linux-amd64-gnu
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            libc: gnu
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            libc: gnu
          - name: linux-amd64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            libc: musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            libc: musl
          - name: windows-amd64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            libc: native

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.rust_target }}"
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Zig
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Test committed native library
        if: matrix.libc != 'musl'
        run: go test -short -count=1 -v ./...

      - name: Test committed musl library
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src golang:1.26-alpine \
            sh -ceu 'apk add --no-cache rust >/dev/null && go test -short -count=1 -v ./...'

      - name: Build native FFI library
        shell: bash
        run: scripts/build-ffi.sh "${{ matrix.rust_target }}"

      - name: Test Rust crate
        if: matrix.libc != 'musl'
        run: cargo test --workspace --target "${{ matrix.rust_target }}"

      - name: Test rebuilt native library
        if: matrix.libc != 'musl'
        run: go test -short -count=1 -v ./...

      - name: Test rebuilt musl library
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src golang:1.26-alpine \
            sh -ceu 'apk add --no-cache rust >/dev/null && go test -short -count=1 -v ./...'

  engine:
    name: linux-amd64-engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        id: engine-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1

      - name: Install Rust toolchain
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Build or verify pinned engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go run ./.github/scripts/build-engine 2>&1 | tee .ci-logs/engine-acquisition.log

      - name: Upload engine build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-engine-logs
          path: |
            .ci-logs/engine-acquisition.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: linux-amd64-conformance
    runs-on: ubuntu-latest
    needs: engine
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1
          fail-on-cache-miss: true

      - name: Run real-engine conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go test -race -count=1 -timeout=25m -v ./... 2>&1 | tee .ci-logs/conformance.log

      - name: Upload conformance failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-conformance-logs
          path: |
            .ci-logs/conformance.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14

  soak-smoke:
    name: linux-amd64-soak-smoke
    runs-on: ubuntu-latest
    needs: engine
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1
          fail-on-cache-miss: true

      - name: Run strict chaos smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go run ./cmd/soak 2>&1 | tee .ci-logs/soak-smoke.log

      - name: Upload soak failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-soak-smoke-logs
          path: |
            .ci-logs/soak-smoke.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14
