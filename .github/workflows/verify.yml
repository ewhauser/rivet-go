name: verify

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            libc: native
          - name: linux-amd64-gnu
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            libc: gnu
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            libc: gnu
          - name: linux-amd64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            libc: musl
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            libc: musl
          - name: windows-amd64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            libc: native

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.rust_target }}"
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Zig
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Test committed native library
        if: matrix.libc != 'musl'
        run: go test -short -count=1 -v ./...

      - name: Test committed musl library
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src golang:1.26-alpine \
            go test -short -count=1 -v ./...

      - name: Build native FFI library
        shell: bash
        run: scripts/build-ffi.sh "${{ matrix.rust_target }}"

      - name: Test Rust crate
        if: matrix.libc != 'musl'
        run: cargo test --workspace --target "${{ matrix.rust_target }}"

      - name: Test rebuilt native library
        if: matrix.libc != 'musl'
        run: go test -short -count=1 -v ./...

      - name: Test rebuilt musl library
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src golang:1.26-alpine \
            go test -short -count=1 -v ./...

  conformance:
    name: linux-amd64-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Cache pinned engine
        uses: actions/cache@v5
        with:
          path: ~/.cache/rivet-go/engine-v2.3.10
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081

      - name: Run real-engine conformance
        run: go test -race -count=1 -v ./...
