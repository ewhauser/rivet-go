name: verify

on:
  pull_request: {}
  push:
    branches: [main, ci-green]

# Astral-style default deny: workflows start with no permissions and each job
# grants exactly what it needs.
permissions: {}

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # checkout only
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            libc: native
            platform: darwin_arm64
            artifact: librivetkit_go_ffi.dylib
          - name: linux-amd64-gnu
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            libc: gnu
            platform: linux_amd64
            artifact: librivetkit_go_ffi.so
          - name: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            libc: gnu
            platform: linux_arm64
            artifact: librivetkit_go_ffi.so
          - name: linux-amd64-musl
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-musl
            libc: musl
            platform: linux_amd64_musl
            artifact: librivetkit_go_ffi.so
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            libc: musl
            platform: linux_arm64_musl
            artifact: librivetkit_go_ffi.so
          - name: windows-amd64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            libc: native
            platform: windows_amd64
            artifact: rivetkit_go_ffi.dll

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --target "${{ matrix.rust_target }}"
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install Zig
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        if: matrix.libc == 'gnu' || matrix.libc == 'musl'
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Build native FFI library
        shell: bash
        env:
          RIVET_GO_SKIP_NOTICES: "1"
        run: scripts/build-ffi.sh "${{ matrix.rust_target }}"

      - name: Verify generated boundary files are committed
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code internal/ffi/abi_version_generated.go internal/ffi/include
          # The checksum manifest must match the release artifacts, which is
          # enforced at publish time by release.yml; report any local drift.
          git --no-pager diff internal/ffi/checksums.txt || true

      - name: Test Rust crate
        if: matrix.libc != 'musl'
        run: cargo test --workspace --target "${{ matrix.rust_target }}"

      - name: Test with built native library
        if: matrix.libc != 'musl'
        env:
          RIVET_GO_FFI_LIB: ${{ github.workspace }}/internal/ffi/lib/${{ matrix.platform }}/${{ matrix.artifact }}
        run: go test -short -count=1 -v ./...

      - name: Test with built musl library
        if: matrix.libc == 'musl'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src" --workdir /src \
            --env RIVET_GO_FFI_LIB="/src/internal/ffi/lib/${{ matrix.platform }}/${{ matrix.artifact }}" \
            golang:1.26-alpine \
            sh -ceu 'apk add --no-cache rust >/dev/null && go test -short -count=1 -v ./...'

  lint:
    name: lint-and-licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pipx install zizmor==1.29.0
          zizmor --persona=regular .github/workflows/

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Unsupported-platform stub builds and passes
        run: go test -short -count=1 -tags rivetgo_ffi_stub ./internal/ffi/

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Install cargo-deny and cargo-about
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: License gate
        run: cargo deny check licenses

      - name: Third-party notices are current
        run: |
          set -euo pipefail
          cargo about generate --features ffi-test about.hbs | tr -d '\r' > THIRD-PARTY-NOTICES.md
          git diff --exit-code THIRD-PARTY-NOTICES.md

  engine:
    name: linux-amd64-engine
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        id: engine-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1

      - name: Install Rust toolchain
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Build or verify pinned engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go run ./.github/scripts/build-engine 2>&1 | tee .ci-logs/engine-acquisition.log

      - name: Upload engine build failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-engine-logs
          path: |
            .ci-logs/engine-acquisition.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: linux-amd64-conformance
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: read # checkout only
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1
          fail-on-cache-miss: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Build host native FFI library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path Cargo.toml --package rivetkit-go-ffi \
            --features ffi-test --locked --release
          echo "RIVET_GO_FFI_LIB=$PWD/target/release/librivetkit_go_ffi.so" >> "$GITHUB_ENV"

      - name: Run real-engine conformance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go test -race -count=1 -timeout=25m -v ./... 2>&1 | tee .ci-logs/conformance.log

      - name: Upload conformance failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-conformance-logs
          path: |
            .ci-logs/conformance.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14

  soak-smoke:
    name: linux-amd64-soak-smoke
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: read # checkout only
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore pinned engine
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/rivet-go/engine-v2.3.10/rivet-engine
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          key: rivet-engine-v2.3.10-${{ runner.os }}-${{ runner.arch }}-957d4e482f404913ca1955d8ecc357533f6fd081-source-cwd-v1
          fail-on-cache-miss: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      - name: Build host native FFI library
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path Cargo.toml --package rivetkit-go-ffi \
            --features ffi-test --locked --release
          echo "RIVET_GO_FFI_LIB=$PWD/target/release/librivetkit_go_ffi.so" >> "$GITHUB_ENV"

      - name: Run strict chaos smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          go run ./cmd/soak 2>&1 | tee .ci-logs/soak-smoke.log

      - name: Upload soak failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-soak-smoke-logs
          path: |
            .ci-logs/soak-smoke.log
            ~/.cache/rivet-go/engine-v2.3.10/build.log
          if-no-files-found: ignore
          retention-days: 14
