[package]
name = "rivet-go-bench-runner-rust"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
rivetkit = { git = "https://github.com/rivet-dev/rivet", tag = "v2.3.10" }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace]

[profile.release]
debug = true
strip = false
