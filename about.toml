# cargo-about configuration: the license allow-list for everything statically
# linked into the prebuilt native libraries under internal/ffi/lib/.
# THIRD-PARTY-NOTICES.md is generated from this via scripts/build-ffi.sh.
# Keep in sync with deny.toml, which gates the same set in CI.

# Resolve dependencies for exactly the six release targets so the generated
# notices are identical no matter which host runs the generation.
targets = [
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
