# cargo-about configuration: the license allow-list for everything statically
# linked into the prebuilt native libraries under internal/ffi/lib/.
# THIRD-PARTY-NOTICES.md is generated from this via scripts/build-ffi.sh.
# Keep in sync with deny.toml, which gates the same set in CI.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
