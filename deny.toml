# cargo-deny configuration. The licenses gate is authoritative for what may
# be statically linked into the redistributed native libraries; keep it in
# sync with about.toml, which generates THIRD-PARTY-NOTICES.md.
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
